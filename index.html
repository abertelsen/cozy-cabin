<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cozy Winter Cabin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="scene">
    <img id="room" src="assets/magnific_the-interior-of-a-cozy-ca_p85ufTZehw.png" alt="Interior of a cozy winter cabin" />
  </div>

  <div id="controls" role="group" aria-label="Music controls">
    <button id="play" aria-label="Play music" title="Play / Pause">&#9654;</button>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Volume" />
  </div>

  <script src="music.js"></script>
  <script src="script.js"></script>
</body>
</html>
